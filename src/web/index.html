<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake 3310</title>
  <link rel="icon" href="./icone.svg" type="image/svg+xml">
</head>
<body>
  <header class="header"><img src="./icone.svg" alt=""><h1>Snake 3310</h1></header>
  <main class="phone" aria-label="Celular Nokia 3310">
    <div class="brand" aria-hidden="true">NOKIA</div>
    <div class="screen">
      <section class="layer" id="menu" aria-labelledby="menu-heading">
        <h2 id="menu-heading">Snake 3310</h2>
        <nav aria-label="Menu do jogo"><ul class="menu">
          <li><button type="button" data-screen="play">Jogar</button></li>
          <li><button type="button" data-screen="ranking">Ranking</button></li>
          <li><button type="button" data-screen="instructions">Instruções</button></li>
        </ul></nav>
      </section>
      <section class="layer" id="play" aria-labelledby="play-heading" hidden>
        <h2 id="play-heading" tabindex="-1">Jogar</h2>
        <p class="notice">Em breve!<br>A partida será entregue no próximo épico.<br>C volta</p>
      </section>
      <section class="layer" id="ranking" aria-labelledby="ranking-heading" aria-busy="false" hidden>
        <h2 id="ranking-heading" tabindex="-1">Ranking</h2>
        <p class="notice" id="ranking-status" role="status"></p>
        <ol id="ranking-list" aria-label="Cinco maiores placares"></ol>
      </section>
      <section class="layer" id="instructions" aria-labelledby="instructions-heading" hidden>
        <h2 id="instructions-heading" tabindex="-1">Instruções</h2>
        <ul class="instructions">
          <li>2/8, setas ou W/S: menu</li>
          <li>OK ou Enter: escolher</li>
          <li>C ou Esc: voltar</li>
        </ul>
      </section>
    </div>
    <div class="actions">
      <button class="key" type="button" data-key="ok" aria-label="OK, selecionar ou tentar de novo">OK</button>
      <button class="key" type="button" data-key="c" aria-label="C, voltar">C</button>
    </div>
    <div class="keypad" role="group" aria-label="Teclado numérico">
      <button class="key" type="button" data-key="1">1 <small>.,</small></button>
      <button class="key" type="button" data-key="2" aria-label="2 abc ▲, para cima">2 <small>abc ▲</small></button>
      <button class="key" type="button" data-key="3">3 <small>def</small></button>
      <button class="key" type="button" data-key="4" aria-label="4 ◀ ghi, para a esquerda">4 <small>◀ ghi</small></button>
      <button class="key" type="button" data-key="5" aria-label="5 jkl, selecionar">5 <small>jkl</small></button>
      <button class="key" type="button" data-key="6" aria-label="6 mno ▶, para a direita">6 <small>mno ▶</small></button>
      <button class="key" type="button" data-key="7">7 <small>pqrs</small></button>
      <button class="key" type="button" data-key="8" aria-label="8 tuv ▼, para baixo">8 <small>tuv ▼</small></button>
      <button class="key" type="button" data-key="9">9 <small>wxyz</small></button>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
